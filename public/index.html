<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CI/CD Pipeline Live</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <div class="header">
      <h1>CI/CD Pipeline Live 🚀</h1>
      <span id="status" class="badge">CHECKING...</span>
    </div>
    <p class="msg" id="message">Loading message...</p>
    <div class="info">
      <div><strong>Version:</strong> <span id="version">-</span></div>
      <div><strong>Deployed:</strong> <span id="deployed">-</span></div>
    </div>
    <button id="refreshBtn">🔄 Refresh Status</button>
  </div>
  <script src="app.js"></script>
</body>
</html>
